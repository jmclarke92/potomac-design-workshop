<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal Design Workshop – Touchscreen Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1f1c1b; --muted:#6a645e; --line:#d9d3ca;
  --brand:#a51c30; --brand-text:#a51c30; --brand-soft:#f5e3e6; --slate:#dfe6ee; --slate-ink:#2d4259;
  --s0:#fff0a6; --s1:#d8ecf5; --s2:#d9efd0; --s3:#fde0c2; --sticky-ink:#2a2410;
  --ok:#2f7a45;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", "Segoe UI", system-ui, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151312; --surface:#211e1c; --ink:#f2ede8; --muted:#a79f97; --line:#3b3632;
    --brand-text:#ff8a98; --brand-soft:#3a1c22; --slate:#26323f; --slate-ink:#cfdcec;
    --s0:#5c5220; --s1:#1f4a5c; --s2:#2f5427; --s3:#5e4020; --sticky-ink:#f5efe3; --ok:#6fcf8a;
  }
}
:root[data-theme="dark"]{
  --bg:#151312; --surface:#211e1c; --ink:#f2ede8; --muted:#a79f97; --line:#3b3632;
  --brand-text:#ff8a98; --brand-soft:#3a1c22; --slate:#26323f; --slate-ink:#cfdcec;
  --s0:#5c5220; --s1:#1f4a5c; --s2:#2f5427; --s3:#5e4020; --sticky-ink:#f5efe3; --ok:#6fcf8a;
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:clamp(15px,1.08vw,24px);height:100%}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{display:flex;flex-direction:column;height:100%}

/* header */
.top{display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem;background:var(--brand);color:#fff;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-size:1.45rem;margin:0;font-weight:700;letter-spacing:.005em}
.top .sub{font-size:.9rem;opacity:.85}
.top .spacer{flex:1}
.seg{display:flex;background:rgba(0,0,0,.22);border-radius:.8rem;padding:.2rem}
.seg button{border:0;background:transparent;color:#fff;padding:.55rem 1rem;border-radius:.6rem;min-height:2.7rem;font-weight:700;opacity:.8}
.seg button[aria-pressed="true"]{background:#fff;color:#7d1424;opacity:1}
.tbtn{border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:.8rem;min-height:2.9rem;padding:0 1rem;font-weight:700}
.tbtn:active{background:rgba(255,255,255,.2)}
.timer{display:flex;align-items:center;gap:.5rem;background:rgba(0,0,0,.25);border-radius:1rem;padding:.3rem .5rem .3rem .3rem}
.timer .face{display:flex;align-items:center;gap:.6rem;border:0;background:transparent;color:#fff;padding:0 .4rem 0 0;min-height:3.2rem}
.timer svg{width:2.9rem;height:2.9rem;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .bg{stroke:rgba(255,255,255,.25)}
.timer .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer .t{font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:700;min-width:3.6ch}
.timer .mini{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:.6rem;min-height:2.6rem;min-width:2.6rem;font-weight:700}
.timer.done{animation:pulse .8s ease-in-out 4}
@keyframes pulse{50%{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){.timer.done{animation:none;outline:3px solid #fff}}

/* stepper */
.stepper{display:flex;gap:.5rem;padding:.7rem 1.25rem;background:var(--slate);overflow-x:auto}
.step{display:flex;align-items:center;gap:.55rem;border:2px solid transparent;background:var(--surface);color:var(--ink);border-radius:2rem;padding:.35rem 1rem .35rem .4rem;min-height:3rem;white-space:nowrap;font-weight:700}
.step .n{display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--slate);color:var(--slate-ink);font-size:.95rem}
.step.done .n{background:var(--ok);color:#fff}
.step.on{border-color:var(--brand);background:var(--brand-soft)}
.step.on .n{background:var(--brand);color:#fff}

/* stage layout */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(17rem,24%) 1fr;grid-template-rows:minmax(0,1fr);gap:1.25rem;padding:1.25rem}
.rail{overflow:auto;padding-right:.25rem}
.work{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:1rem;padding:.25rem}
.phase{font-size:1rem;color:var(--brand-text);font-weight:700;margin:0 0 .15rem}
.rail h2{font-family:var(--serif);font-size:1.9rem;line-height:1.15;margin:0 0 .6rem}
.rail h3{font-family:var(--serif);font-size:1.15rem;margin:1.1rem 0 .4rem}
.rail p,.rail li{font-size:1.02rem}
.rail ul,.rail ol{padding-left:1.2rem;margin:.3rem 0}
.rail li{margin:.3rem 0}
.timepill{display:inline-block;background:var(--slate);color:var(--slate-ink);border-radius:2rem;padding:.2rem .8rem;font-weight:700;font-size:.95rem;margin-bottom:.8rem}
.muted{color:var(--muted)}
.ask{border-left:5px solid var(--brand);padding:.2rem 0 .2rem .9rem;margin:.9rem 0;font-family:var(--serif);font-size:1.15rem}

/* controls */
.btn{min-height:3.2rem;padding:0 1.4rem;border-radius:.8rem;border:2px solid var(--line);background:var(--surface);font-weight:700}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.quiet{border-style:dashed;color:var(--muted)}
.btn.sm{min-height:2.6rem;padding:0 .9rem;font-size:.95rem}
.input{width:100%;min-height:3.3rem;padding:.6rem .9rem;border:2px solid var(--line);border-radius:.7rem;background:var(--surface);font-size:1.1rem}
.input:focus,.btn:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
textarea.input{min-height:5.5rem;resize:none;line-height:1.35}
.input.big{font-family:var(--serif);font-size:2.1rem;font-weight:700;min-height:4.2rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.chip{min-height:2.9rem;padding:.3rem 1rem;border-radius:2rem;border:2px solid var(--line);background:var(--surface);font-weight:700}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.who{display:inline-flex;align-items:center;gap:.5rem}
.dot{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;flex:none}
.label{font-weight:700;margin:0 0 .3rem}
.board-card{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:1.1rem}

/* team */
.members{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem}
.member{border-top:8px solid var(--c);background:var(--surface);border-radius:.4rem .4rem 1rem 1rem;padding:1rem;display:flex;flex-direction:column;gap:.6rem;border-left:2px solid var(--line);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}

/* board / notes */
.board{position:relative;flex:1;min-height:22rem;border:2px dashed var(--line);border-radius:1.1rem;background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:30px 30px;overflow:hidden}
.board .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--serif);font-size:1.4rem;text-align:center;padding:2rem;pointer-events:none}
.note{position:absolute;width:15.5rem;background:var(--c);color:var(--sticky-ink);padding:.8rem .9rem .6rem;border-radius:.2rem .2rem .2rem 1.4rem;box-shadow:0 .25rem .8rem rgba(0,0,0,.18);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.note.focus{outline:4px solid var(--brand);outline-offset:3px}
.note .stem{font-size:.85rem;opacity:.7;margin:0 0 .15rem}
.note .txt{font-size:1.08rem;line-height:1.3;margin:0 0 .5rem}
.note .acts{display:flex;gap:.35rem;align-items:center;justify-content:space-between}
.note button{border:0;background:rgba(0,0,0,.12);color:inherit;border-radius:.6rem;min-height:2.5rem;min-width:2.5rem;padding:0 .6rem;font-weight:700}
.note .by{display:flex;align-items:center;gap:.4rem;font-size:.85rem;margin-top:.4rem}
.banner{background:var(--brand-soft);border:2px solid var(--brand);border-radius:.9rem;padding:.7rem 1rem;font-family:var(--serif);font-size:1.15rem}

/* statement */
.stmt{font-family:var(--serif);font-size:1.6rem;line-height:1.6}
.stmt .fill{background:var(--brand-soft);border-bottom:3px solid var(--brand);padding:0 .25rem}
.stmt .blank{color:var(--muted);border-bottom:3px dashed var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.55rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* analogy */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.8rem}
.tile{min-height:6rem;border:2px solid var(--line);background:var(--surface);border-radius:1rem;font-family:var(--serif);font-size:1.25rem;font-weight:700;padding:.6rem;text-align:center}
.tile[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.attrs{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:a}
.attrs li{display:flex;align-items:center;gap:.7rem;background:var(--surface);border:2px solid var(--line);border-radius:.8rem;padding:.4rem .6rem;min-height:3.2rem;counter-increment:a}
.attrs li::before{content:counter(a);display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--slate);color:var(--slate-ink);font-weight:700;flex:none}
.attrs li span{flex:1}
.progress{height:.6rem;background:var(--line);border-radius:1rem;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);transition:width .25s}

/* ideation */
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.9rem;flex:1;min-height:0;overflow:auto;align-content:start}
.lane{background:var(--slate);border-radius:1rem;padding:.8rem;display:flex;flex-direction:column;gap:.6rem;min-height:12rem}
.lane h4{font-family:var(--serif);font-size:1.15rem;margin:0}
.lane .q{font-size:.92rem;color:var(--slate-ink);margin:0}
.idea{background:var(--c);color:var(--sticky-ink);border-radius:.3rem .3rem .3rem 1.2rem;padding:.7rem .8rem;box-shadow:0 .2rem .6rem rgba(0,0,0,.15)}
.idea.pick{outline:4px solid var(--brand);outline-offset:2px}
.idea p{margin:0 0 .5rem;font-size:1.05rem}
.idea .build{border-left:3px solid rgba(0,0,0,.3);padding-left:.6rem;margin:.3rem 0;font-size:.98rem}
.idea .acts{display:flex;gap:.4rem;flex-wrap:wrap}
.idea button{border:0;background:rgba(0,0,0,.12);color:inherit;border-radius:.6rem;min-height:2.5rem;padding:0 .8rem;font-weight:700}
.composer{background:var(--surface);border:2px solid var(--brand);border-radius:1rem;padding:.8rem;display:flex;flex-direction:column;gap:.6rem}
.composer .mode{font-weight:700;color:var(--brand-text)}

/* pitch */
.arc{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem;align-items:end}
.arc .pc{background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:.9rem;display:flex;flex-direction:column;gap:.5rem}
.arc .pc:nth-child(2){margin-bottom:1.2rem}
.arc .pc:nth-child(3){margin-bottom:2.4rem;border-color:var(--brand)}
.arc .pc:nth-child(4){margin-bottom:1.2rem}
.pc h4{font-family:var(--serif);font-size:1.1rem;margin:0}
.pc .hint{font-size:.9rem;color:var(--muted);margin:0}
.canvaswrap{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.7rem}
canvas.sketch{display:block;width:100%;aspect-ratio:25/16;background:#fff repeating-linear-gradient(0deg,transparent 0 31px,#e6e1d8 31px 32px);border-radius:.6rem;touch-action:none;cursor:crosshair}
.swatch{width:2.6rem;height:2.6rem;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 4px var(--brand)}
.pick{display:block;width:100%;text-align:left;min-height:4rem;padding:.8rem 1rem;border:2px solid var(--line);background:var(--surface);border-radius:.9rem;margin-bottom:.6rem;font-size:1.05rem;line-height:1.35}
.pick[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.padstage{position:relative;container-type:inline-size}
.stks{position:absolute;inset:0;pointer-events:none}
.stk{position:absolute;width:15cqw;background:var(--c);color:var(--sticky-ink);border-radius:.2cqw .2cqw .2cqw 1.8cqw;box-shadow:0 .3cqw .9cqw rgba(0,0,0,.22);pointer-events:auto;font-size:1.35cqw;line-height:1.3;display:flex;flex-direction:column}
.stk-bar{display:flex;align-items:center;justify-content:space-between;min-height:2.4rem;padding:0 .2rem 0 .6rem;touch-action:none}
.stk-grip{flex:1;align-self:stretch;display:flex;align-items:center;cursor:grab;touch-action:none;opacity:.6;font-size:1.1rem;user-select:none}
.stk-x{border:0;background:rgba(0,0,0,.12);color:inherit;border-radius:.5rem;min-width:2.2rem;min-height:2.2rem;font-weight:700}
.stk-text{width:100%;border:0;background:transparent;color:inherit;font:inherit;resize:none;outline:none;padding:0 .8cqw 1cqw;overflow:hidden;min-height:5cqw}
.stk-read{padding:1cqw;white-space:pre-wrap;min-height:5cqw}
.stkbtn{width:2.6rem;height:2.6rem;border:2px solid rgba(0,0,0,.25);border-radius:.4rem;color:var(--sticky-ink);font-weight:700;font-size:1.3rem;padding:0}
.shapes{position:absolute;inset:0;pointer-events:none}
.shp{position:absolute;aspect-ratio:1;pointer-events:auto;touch-action:none;cursor:grab}
.shp svg{display:block;width:100%;height:100%;overflow:visible}
.shp.sel{outline:3px dashed var(--brand);outline-offset:3px}
.shp .hdl,.shp .xbtn{display:none;position:absolute;width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--brand);background:var(--brand);color:#fff;font-weight:700;padding:0;line-height:1;touch-action:none}
.shp.sel .hdl,.shp.sel .xbtn{display:grid;place-items:center}
.shp .hdl{right:-1.2rem;bottom:-1.2rem;cursor:nwse-resize}
.shp .xbtn{right:-1.2rem;top:-1.2rem}
.attrs li .input{border:0;background:transparent;padding:.3rem .2rem;min-height:2.6rem}
.attrs li .tag{flex:none;font-size:.85rem;font-weight:700;color:var(--brand-text);background:var(--brand-soft);border-radius:2rem;padding:.15rem .7rem}
.stage.wide{grid-template-columns:1fr}
.stage.wide .rail{display:none}
.tile.dim{opacity:.45;filter:grayscale(1)}
.canvaswrap.fill{flex:1;min-height:22rem;display:flex;flex-direction:column}
.canvaswrap.fill .padstage{flex:1;min-height:0}
.sketch.fill{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;background:#fff}
.empty-pad{position:absolute;inset:0;display:grid;place-items:center;color:#8a8580;font-family:var(--serif);font-size:1.1rem}
.review{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1rem;align-items:start}
.adm{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:var(--bg);color:var(--ink)}
.adm .body{flex:1;min-height:0;overflow:auto;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;width:100%;max-width:1800px;margin:0 auto}
.gcard{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.8rem}
.grow{display:grid;grid-template-columns:4.5rem minmax(0,1.8fr) minmax(0,1fr) auto;gap:1.2rem;align-items:start}
.gnum{font-family:var(--serif);font-size:2.6rem;font-weight:700;color:var(--brand-text);line-height:1}
.tname{font-family:var(--serif);font-size:1.3rem;font-weight:700}
.pips{display:flex;gap:.3rem;margin:.5rem 0 .3rem}
.pip{width:.85rem;height:.85rem;border-radius:50%;background:var(--line)}
.pip.on{background:var(--ok)}
.pip.cur{background:var(--brand)}
.tag2{display:inline-block;margin-left:.5rem;font-size:.85rem;font-weight:700;color:#fff;background:var(--ok);border-radius:2rem;padding:.05rem .6rem}
.gacts{display:flex;flex-direction:column;gap:.5rem;min-width:9.5rem}
.fitwrap{flex:1;min-height:0;min-width:0;container-type:size;display:flex;align-items:center;justify-content:center}
.so-card .fitwrap{align-items:flex-start}
.fitbox{width:min(100cqw,calc(100cqh * var(--asp)));aspect-ratio:var(--asp);flex:none}
.fitbox img{height:100%!important;object-fit:fill}
.so{flex:1;min-height:20rem;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-rows:minmax(0,1fr);gap:1rem}
.so.lean{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr)}
.so-col{display:flex;flex-direction:column;gap:1rem;min-height:0;min-width:0}
.so-card{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.7rem 1rem;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:auto}
.so-card h3{font-family:var(--serif);font-size:1.15rem;margin:0 0 .5rem}
.ptop{display:flex;gap:1rem;align-items:center}
.pdraw{flex:0 0 13rem}
.prole{font-weight:700;font-size:.98rem;line-height:1.3}
.plists{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1rem;font-size:.84rem;line-height:1.25;margin-top:.4rem}
.plists ul{margin:.1rem 0;padding-left:1.1rem}
.plists li{margin:.15rem 0}
.stage.wide{padding-top:.5rem;padding-bottom:.7rem;gap:.6rem}
.persona-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1rem;min-height:0}

/* footer */
.nav{display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem;border-top:2px solid var(--line);background:var(--surface)}
.nav .note-s{flex:1;font-size:.9rem;color:var(--muted)}

/* overlay + toast */
.present{position:fixed;inset:0;background:var(--brand);color:#fff;z-index:50;display:flex;flex-direction:column;justify-content:center;padding:5vw;gap:1.5rem}
.present .k{font-size:1.4rem;opacity:.85}
.present .v{font-family:var(--serif);font-size:clamp(2rem,4.2vw,4.4rem);line-height:1.2;font-weight:700;white-space:pre-wrap}
.present .bar{position:absolute;left:5vw;right:5vw;bottom:4vh;display:flex;gap:1rem;align-items:center}
.present .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.6);color:#fff}
.toast{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.8rem 1.3rem;border-radius:2rem;z-index:60;font-weight:700;max-width:90vw;text-align:center}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .stage{grid-template-columns:1fr;grid-template-rows:auto;overflow:visible}
  .persona-grid,.two,.review,.grow,.so,.so.lean{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Legal Design Workshop</h1>
      <div class="sub" id="subtitle">Touchscreen demo</div>
    </div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Choose case">
      <button data-mode="bob" aria-pressed="true">Bob Anderson case</button>
      <button data-mode="omv" aria-pressed="false">O’Melveny challenge</button>
      <button data-mode="plg" aria-pressed="false">Potomac · Day 1</button>
      <button data-mode="plg2" aria-pressed="false">Potomac · Day 2</button>
    </div>
    <button class="tbtn" id="b-sample">Fill sample</button>
    <button class="tbtn" id="b-reset">Reset</button>
    <button class="tbtn" id="b-full">Full screen</button>
    <div class="timer" id="timer">
      <button class="face" id="t-face" aria-label="Start or pause timer">
        <svg viewBox="0 0 50 50"><circle class="bg" cx="25" cy="25" r="21"/><circle class="fg" id="t-ring" cx="25" cy="25" r="21" stroke-dasharray="131.9" stroke-dashoffset="0"/></svg>
        <span class="t" id="t-time">5:00</span>
        <span id="t-state" style="font-size:.85rem;opacity:.85">Start</span>
      </button>
      <button class="mini" id="t-plus" aria-label="Add one minute">+1</button>

  }

}

const T = {left: 300, total: 300, end: 0, running: false};

function setTimer(mins){ T.total = T.left = Math.round(mins * 60); T.running = false; $("#timer").classList.remove("done"); drawTimer(); }
function drawTimer(){
  const m = Math.floor(T.left / 60), s = T.left % 60;

  $("#t-ring").style.strokeDashoffset = String(CIRC * (1 - (T.total ? T.left / T.total : 0)));
  $("#t-state").textContent = T.running ? "Pause" : (T.left === 0 ? "Done" : "Start");
}
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(d => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + .15); });
  }catch(e){}
}
setInterval(() => {
  if (!T.running) return;
  const left = Math.max(0, Math.round((T.end - Date.now()) / 1000));
  if (left !== T.left){ T.left = left; drawTimer(); }
  if (left === 0){ T.running = false; $("#timer").classList.add("done"); beep(); drawTimer(); }
}, 250);

  drawTimer();
};
$("#t-plus").onclick = () => { T.left += 60; T.total = Math.max(T.total, T.left); if (T.running) T.end += 60000; drawTimer(); };

async function api(method, path, body, opts){
  opts = opts || {};

    if (opts.pin) headers["x-admin-pin"] = opts.pin;
    const r = await fetch(path, {method, headers, body: body === undefined ? undefined : JSON.stringify(body), signal: ctl.signal, cache: "no-store"});
    let data = null; try { data = await r.json(); } catch (e) {}
    if (!r.ok){ const e = new Error((data && data.error) || ("HTTP " + r.status)); e.status = r.status; throw e; }

}

    }
    const snap = JSON.stringify(liveSnapshot());
    await api("PUT", "/api/groups/" + LV.id + "/state?k=" + encodeURIComponent(LV.key), JSON.parse(snap));
    LV.last = snap; setStatus("saved");
  } catch (e){ setStatus("offline"); }
  finally { LV.busy = false; }
}
setInterval(liveTick, 3000);
document.addEventListener("visibilitychange", () => { if (document.hidden) liveTick(); });
function showBlock(msg){
  const el = h("div", {class: "present", style: "background:var(--ink);color:var(--bg);align-items:flex-start"},
    h("div", {class: "v", style: "font-size:clamp(1.6rem,3vw,2.6rem)"}, msg),
    h("div", {class: "bar", style: "position:static"}, h("button", {class: "btn", onclick: () => el.remove()}, "Continue without saving (demo)")));
  document.body.append(el);
}
async function initLive(){
  try { const r = await api("GET", "/api/ping", undefined, {timeout: 2500}); LIVE = !!(r && r.ok); } catch (e){ LIVE = false; }
  if (!LIVE) return;
  const p = new URLSearchParams(location.hash.slice(1));
  if (location.hash === "#admin") return;
  const g = p.get("g"), k = p.get("k");
  if (!g || !k){ LV.blocked = true; showBlock("Open the link your facilitator gave your group. This page needs your group’s own link to save your work."); return; }
  try {
    const d = await api("GET", "/api/groups/" + encodeURIComponent(g) + "?k=" + encodeURIComponent(k));
    S.groupNo = g;
    if (d.state) applySnapshot(S, d.state);
    S.d2.pool = {talent: d.setup.talent ? [d.setup.talent] : [], client: d.setup.client ? [d.setup.client] : []};
    for (const n of ["drawing", "whiteboard"]){
      try { const im = await api("GET", "/api/groups/" + encodeURIComponent(g) + "/img/" + n + "?k=" + encodeURIComponent(k)); S[n] = im.data || null; } catch (e) {}
      LV.imgSent[n] = S[n] || "";
    }
    LV.id = g; LV.key = k; LV.on = true; LV.last = JSON.stringify(liveSnapshot());
    ["#b-sample", "#b-reset"].forEach(sel => { const b = document.querySelector(sel); if (b) b.style.display = "none"; });
    setTimer(STG()[S.stage].mins);
    setStatus("saved");
  } catch (e){
    showBlock(e.status === 403 ? "This group link isn’t valid. Ask your facilitator for the right link." : "Couldn’t reach the workshop server. Check your connection and reload.");
  }
}

/* Facilitator (live) */
const adminInputFocused = () => { const a = document.activeElement; return !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && document.getElementById("admin")?.contains(a)); };
function mergeAdminList(list){
  const byId = new Map(A.groups.map(g => [g.id, g]));
  A.groups = list.map(x => {
    const old = byId.get(x.id) || {}, st = x.state || {};
    Object.assign(old, {id: x.id, key: x.key, team: st.team || "", step: st.maxStage || 0, cur: st.stage || 0, chosen: st.kind || null, updatedAt: st.updatedAt || 0});
    if (!A.dirty.has(x.id)){ old.talent = x.talent; old.client = x.client; }
    return old;
  });
}
async function adminLoad(){
  try {
    const d = await api("GET", "/api/admin/groups", undefined, {pin: A.pin});
    A.locked = false; A.msg = ""; mergeAdminList(d.groups); renderAdmin();
  } catch (e){
    if (e.status === 401){ A.locked = true; A.pin = ""; setPin(""); A.msg = "That PIN didn’t work. Try again."; }
    else { A.msg = e.message; }
    renderAdmin();
  }
}
async function adminPoll(force){
  if (!A || !A.live || A.locked) return;
  try {
    const sig = () => JSON.stringify(A.groups.map(g => [g.id, g.team, g.step, g.cur, g.chosen, g.updatedAt, g.talent, g.client, g.key]));
    const d = await api("GET", "/api/admin/groups", undefined, {pin: A.pin});
    const before = sig(); mergeAdminList(d.groups); A.msg = "";
    if (before === sig() && !force) return;
    if (A.present != null){
      const g = A.groups.find(x => x.id === A.present);
      if (g && g._upd !== g.updatedAt){ try { await loadFull(g); } catch (e) {} }
      renderAdmin();
    } else if (force || !adminInputFocused()) renderAdmin();
  } catch (e){ if (e.status === 401){ A.locked = true; renderAdmin(); } }
}
async function loadFull(g){
  const d = await api("GET", "/api/admin/groups/" + g.id, undefined, {pin: A.pin});
  const st = freshState("plg2");
  if (d.state) applySnapshot(st, d.state);
  st.d2.pool = {talent: d.setup.talent ? [d.setup.talent] : [], client: d.setup.client ? [d.setup.client] : []};
  st.drawing = d.drawing || null; st.whiteboard = d.whiteboard || null;
  g._st = st; g._upd = g.updatedAt;
}
function setPresent(id){
  A.present = id;
  const g = A.groups.find(x => x.id === id);
  if (A.live && g){
    A.loading = true; renderAdmin();
    loadFull(g).catch(e => { A.msg = e.message; }).then(() => { A.loading = false; if (A.present === id) renderAdmin(); });
  } else renderAdmin();
}
function saveConfigSoon(){ clearTimeout(A._t); A._t = setTimeout(saveConfig, 900); }
async function saveConfig(){
  try {
    const d = await api("PUT", "/api/admin/config", {groups: A.groups.map(g => ({id: g.id, key: g.key, talent: g.talent, client: g.client}))}, {pin: A.pin});
    d.groups.forEach(x => { const g = A.groups.find(y => y.id === x.id); if (g) g.key = x.key; });
    A.dirty = new Set(); A.msg = "";
    A.saved = "Setup saved " + new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit", second: "2-digit"});
    const sub = document.getElementById("adm-sub"); if (sub) sub.textContent = "Potomac Law Group · Day 2 · live · " + A.saved;
  } catch (e){ A.msg = "Couldn’t save the setup: " + e.message; const sub = document.getElementById("adm-sub"); if (sub) sub.textContent = A.msg; }
}
function adminLock(){
  const unlock = () => { A.pin = inp.value.trim(); if (!A.pin) return; setPin(A.pin); A.locked = false; A.msg = ""; adminLoad(); };
  const inp = h("input", {class: "input", type: "password", placeholder: "Facilitator PIN", style: "max-width:22rem", onkeydown: e => { if (e.key === "Enter") unlock(); }});
  const top = h("header", {class: "top"}, h("div", {}, h("h1", {}, "Facilitator view"), h("div", {class: "sub"}, "Potomac Law Group · Day 2")), h("div", {class: "spacer"}),
    h("button", {class: "tbtn", onclick: () => { location.hash = ""; route(); }}, "Group view"));
  const body = h("div", {class: "body"}, h("div", {class: "gcard", style: "max-width:34rem;margin:3rem auto;gap:1rem"},
    h("h3", {style: CARD_H}, "Facilitator sign-in"),
    h("p", {class: "muted", style: "margin:0"}, "Enter the PIN you set as ADMIN_PIN in Netlify."),
    inp, h("div", {class: "row"}, h("button", {class: "btn primary", onclick: unlock}, "Unlock")),
    A.msg ? h("p", {style: "margin:0;color:var(--brand-text);font-weight:700"}, A.msg) : null));
  return [top, body];
}
setInterval(() => { if (A && A.live && !A.locked && document.getElementById("admin")?.style.display === "flex") adminPoll(false); }, 6000);

/* Group links carry the group number and that group's two pain points: #g=3&t=...&c=... */
function applyGroupHash(){
  const hs = location.hash.slice(1);
  if (!hs || hs === "admin") return;
  const p = new URLSearchParams(hs);
  if (!p.get("g")) return;
  S.groupNo = p.get("g");
  const t = p.get("t") || "", c = p.get("c") || "";
  S.d2.pool = {talent: t ? [t] : [], client: c ? [c] : []};
}
function route(){
  const adm = location.hash === "#admin";
  document.querySelector(".app").style.display = adm ? "none" : "";
  const el = document.getElementById("admin");
  if (adm){ if (!A) seedAdmin(); renderAdmin(); }
  else if (el && el.style.display !== "none"){ el.style.display = "none"; applyGroupHash(); render(); }
}

/* ---------- boot ---------- */
/* Prototype focus: only Potomac Day 2 is shown.
   Other cases (bob, omv, plg = Day 1) are still defined above (CASES / STAGES_BY).
   To bring them back: set SHOW_CASE_SWITCHER = true. */
const SHOW_CASE_SWITCHER = false;
const DEFAULT_MODE = "plg2";
S = freshState(DEFAULT_MODE);
setTimer(STG()[0].mins);
if (!SHOW_CASE_SWITCHER) document.querySelector(".seg").style.display = "none";
applyGroupHash();
window.addEventListener("hashchange", route);
document.querySelector(".app").style.visibility = "hidden";
initLive().then(() => { document.querySelector(".app").style.visibility = ""; render(); route(); });
</script>
