<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal Design Workshop – Touchscreen Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1f1c1b; --muted:#6a645e; --line:#d9d3ca;
  --brand:#a51c30; --brand-text:#a51c30; --brand-soft:#f5e3e6; --slate:#dfe6ee; --slate-ink:#2d4259;
  --s0:#fff0a6; --s1:#d8ecf5; --s2:#d9efd0; --s3:#fde0c2; --sticky-ink:#2a2410;
  --ok:#2f7a45;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", "Segoe UI", system-ui, Arial, sans-serif;
  --edge:1.5625rem; /* outside-edge breathing room (was 1.25rem; +25%) */
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151312; --surface:#211e1c; --ink:#f2ede8; --muted:#a79f97; --line:#3b3632;
    --brand-text:#ff8a98; --brand-soft:#3a1c22; --slate:#26323f; --slate-ink:#cfdcec;
    --s0:#5c5220; --s1:#1f4a5c; --s2:#2f5427; --s3:#5e4020; --sticky-ink:#f5efe3; --ok:#6fcf8a;
  }
}
:root[data-theme="dark"]{
  --bg:#151312; --surface:#211e1c; --ink:#f2ede8; --muted:#a79f97; --line:#3b3632;
  --brand-text:#ff8a98; --brand-soft:#3a1c22; --slate:#26323f; --slate-ink:#cfdcec;
  --s0:#5c5220; --s1:#1f4a5c; --s2:#2f5427; --s3:#5e4020; --sticky-ink:#f5efe3; --ok:#6fcf8a;
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:clamp(15px,1.08vw,24px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.4;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{display:flex;flex-direction:column;min-height:100vh}
.chrome{position:sticky;top:0;z-index:30}

/* header */
.top{display:flex;align-items:center;gap:1rem;padding:.45rem var(--edge);background:var(--brand);color:#fff;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-size:1.45rem;margin:0;font-weight:700;letter-spacing:.005em}
.top .sub{font-size:.9rem;opacity:.85}
.top .spacer{flex:1}
.seg{display:flex;background:rgba(0,0,0,.22);border-radius:.8rem;padding:.2rem}
.seg button{border:0;background:transparent;color:#fff;padding:.55rem 1rem;border-radius:.6rem;min-height:2.7rem;font-weight:700;opacity:.8}
.seg button[aria-pressed="true"]{background:#fff;color:#7d1424;opacity:1}
.tbtn{border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:.8rem;min-height:2.9rem;padding:0 1rem;font-weight:700}
.tbtn:active{background:rgba(255,255,255,.2)}
/* stepper */
.stepper{display:flex;gap:.5rem;padding:.45rem var(--edge);background:var(--slate);overflow-x:auto}
.step{display:flex;align-items:center;gap:.55rem;border:2px solid transparent;background:var(--surface);color:var(--ink);border-radius:2rem;padding:.3rem 1rem .3rem .35rem;min-height:2.7rem;white-space:nowrap;font-weight:700}
.step .n{display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--slate);color:var(--slate-ink);font-size:.95rem}
.step.done .n{background:var(--ok);color:#fff}
.step.on{border-color:var(--brand);background:var(--brand-soft)}
.step.on .n{background:var(--brand);color:#fff}

/* stage layout */
.stage{flex:1 0 auto;display:grid;grid-template-columns:minmax(17rem,24%) 1fr;grid-template-rows:auto;gap:1.25rem;padding:var(--edge)}
.rail{padding-right:.25rem}
.work{min-width:0;display:flex;flex-direction:column;gap:1rem;padding:.25rem}
.phase{font-size:1rem;color:var(--brand-text);font-weight:700;margin:0 0 .15rem}
.rail h2{font-family:var(--serif);font-size:1.9rem;line-height:1.15;margin:0 0 .6rem}
.rail h3{font-family:var(--serif);font-size:1.15rem;margin:1.1rem 0 .4rem}
.rail p,.rail li{font-size:1.02rem}
.rail ul,.rail ol{padding-left:1.2rem;margin:.3rem 0}
.rail li{margin:.3rem 0}
.timepill{display:inline-block;background:var(--slate);color:var(--slate-ink);border-radius:2rem;padding:.2rem .8rem;font-weight:700;font-size:.95rem;margin-bottom:.8rem}
.muted{color:var(--muted)}
.ask{border-left:5px solid var(--brand);padding:.2rem 0 .2rem .9rem;margin:.9rem 0;font-family:var(--serif);font-size:1.15rem}

/* controls */
.btn{min-height:3.2rem;padding:0 1.4rem;border-radius:.8rem;border:2px solid var(--line);background:var(--surface);font-weight:700}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.quiet{border-style:dashed;color:var(--muted)}
.btn.sm{min-height:2.6rem;padding:0 .9rem;font-size:.95rem}
.input{width:100%;min-height:3.3rem;padding:.6rem .9rem;border:2px solid var(--line);border-radius:.7rem;background:var(--surface);font-size:1.1rem}
.input:focus,.btn:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
textarea.input{min-height:5.5rem;resize:none;line-height:1.35}
.input.big{font-family:var(--serif);font-size:2.1rem;font-weight:700;min-height:4.2rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.chip{min-height:2.9rem;padding:.3rem 1rem;border-radius:2rem;border:2px solid var(--line);background:var(--surface);font-weight:700}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.who{display:inline-flex;align-items:center;gap:.5rem}
.dot{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;flex:none}
.label{font-weight:700;margin:0 0 .3rem}
.board-card{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:1.1rem}

/* team */
.members{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem}
.member{border-top:8px solid var(--c);background:var(--surface);border-radius:.4rem .4rem 1rem 1rem;padding:1rem;display:flex;flex-direction:column;gap:.6rem;border-left:2px solid var(--line);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}

/* board / notes */
.board{position:relative;flex:1;min-height:22rem;border:2px dashed var(--line);border-radius:1.1rem;background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:30px 30px;overflow:hidden}
.board .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--serif);font-size:1.4rem;text-align:center;padding:2rem;pointer-events:none}
.note{position:absolute;width:15.5rem;background:var(--c);color:var(--sticky-ink);padding:.8rem .9rem .6rem;border-radius:.2rem .2rem .2rem 1.4rem;box-shadow:0 .25rem .8rem rgba(0,0,0,.18);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.note.focus{outline:4px solid var(--brand);outline-offset:3px}
.note .stem{font-size:.85rem;opacity:.7;margin:0 0 .15rem}
.note .txt{font-size:1.08rem;line-height:1.3;margin:0 0 .5rem}
.note .acts{display:flex;gap:.35rem;align-items:center;justify-content:space-between}
.note button{border:0;background:rgba(0,0,0,.12);color:inherit;border-radius:.6rem;min-height:2.5rem;min-width:2.5rem;padding:0 .6rem;font-weight:700}
.note .by{display:flex;align-items:center;gap:.4rem;font-size:.85rem;margin-top:.4rem}
.banner{background:var(--brand-soft);border:2px solid var(--brand);border-radius:.9rem;padding:.7rem 1rem;font-family:var(--serif);font-size:1.15rem}

/* statement */
.stmt{font-family:var(--serif);font-size:1.6rem;line-height:1.6}
.stmt .fill{background:var(--brand-soft);border-bottom:3px solid var(--brand);padding:0 .25rem}
.stmt .blank{color:var(--muted);border-bottom:3px dashed var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.55rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* analogy */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.8rem}
.tile{min-height:6rem;border:2px solid var(--line);background:var(--surface);border-radius:1rem;font-family:var(--serif);font-size:1.25rem;font-weight:700;padding:.6rem;text-align:center}
.tile[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.attrs{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;counter-reset:a}
.attrs li{display:flex;align-items:center;gap:.7rem;background:var(--surface);border:2px solid var(--line);border-radius:.8rem;padding:.4rem .6rem;min-height:3.2rem;counter-increment:a}
.attrs li::before{content:counter(a);display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--slate);color:var(--slate-ink);font-weight:700;flex:none}
.attrs li span{flex:1}
.progress{height:.6rem;background:var(--line);border-radius:1rem;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);transition:width .25s}

/* ideation */
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.9rem;flex:1;min-height:0;overflow:auto;align-content:start}
.lane{background:var(--slate);border-radius:1rem;padding:.8rem;display:flex;flex-direction:column;gap:.6rem;min-height:12rem}
.lane h4{font-family:var(--serif);font-size:1.15rem;margin:0}
.lane .q{font-size:.92rem;color:var(--slate-ink);margin:0}
.idea{background:var(--c);color:var(--sticky-ink);border-radius:.3rem .3rem .3rem 1.2rem;padding:.7rem .8rem;box-shadow:0 .2rem .6rem rgba(0,0,0,.15)}
.idea.pick{outline:4px solid var(--brand);outline-offset:2px}
.idea p{margin:0 0 .5rem;font-size:1.05rem}
.idea .build{border-left:3px solid rgba(0,0,0,.3);padding-left:.6rem;margin:.3rem 0;font-size:.98rem}
.idea .acts{display:flex;gap:.4rem;flex-wrap:wrap}
.idea button{border:0;background:rgba(0,0,0,.12);color:inherit;border-radius:.6rem;min-height:2.5rem;padding:0 .8rem;font-weight:700}
.composer{background:var(--surface);border:2px solid var(--brand);border-radius:1rem;padding:.8rem;display:flex;flex-direction:column;gap:.6rem}
.composer .mode{font-weight:700;color:var(--brand-text)}

/* pitch */
.arc{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem;align-items:end}
.arc .pc{background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:.9rem;display:flex;flex-direction:column;gap:.5rem}
.arc .pc:nth-child(2){margin-bottom:1.2rem}
.arc .pc:nth-child(3){margin-bottom:2.4rem;border-color:var(--brand)}
.arc .pc:nth-child(4){margin-bottom:1.2rem}
.pc h4{font-family:var(--serif);font-size:1.1rem;margin:0}
.pc .hint{font-size:.9rem;color:var(--muted);margin:0}
.canvaswrap{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.7rem}
canvas.sketch{display:block;width:100%;aspect-ratio:25/16;background:#fff repeating-linear-gradient(0deg,transparent 0 31px,#e6e1d8 31px 32px);border-radius:.6rem;touch-action:none;cursor:crosshair}
.swatch{width:2.3rem;height:2.3rem;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 4px var(--brand)}
.pick{display:block;width:100%;text-align:left;min-height:4rem;padding:.8rem 1rem;border:2px solid var(--line);background:var(--surface);border-radius:.9rem;margin-bottom:.6rem;font-size:1.05rem;line-height:1.35}
.pick[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.padstage{position:relative;container-type:inline-size}
.stks{position:absolute;inset:0;pointer-events:none}
.stk{position:absolute;width:15cqw;background:var(--c);color:var(--sticky-ink);border-radius:.2cqw .2cqw .2cqw 1.8cqw;box-shadow:0 .3cqw .9cqw rgba(0,0,0,.22);pointer-events:auto;font-size:1.35cqw;line-height:1.3;display:flex;flex-direction:column}
.stk-bar{display:flex;align-items:center;justify-content:space-between;min-height:2.4rem;padding:0 .2rem 0 .6rem;touch-action:none}
.stk-grip{flex:1;align-self:stretch;display:flex;align-items:center;cursor:grab;touch-action:none;opacity:.6;font-size:1.1rem;user-select:none}
.stk-x{border:0;background:rgba(0,0,0,.12);color:inherit;border-radius:.5rem;min-width:2.2rem;min-height:2.2rem;font-weight:700}
.stk-text{width:100%;border:0;background:transparent;color:inherit;font:inherit;resize:none;outline:none;padding:0 .8cqw 1cqw;overflow:hidden;min-height:5cqw}
.stk-read{padding:1cqw;white-space:pre-wrap;min-height:5cqw}
.stkbtn{width:2.3rem;height:2.3rem;border:2px solid rgba(0,0,0,.25);border-radius:.4rem;color:var(--sticky-ink);font-weight:700;font-size:1.3rem;padding:0}
.shapes{position:absolute;inset:0;pointer-events:none}
.shp{position:absolute;aspect-ratio:1;pointer-events:auto;touch-action:none;cursor:grab}
.shp svg{display:block;width:100%;height:100%;overflow:visible}
.shp.sel{outline:3px dashed var(--brand);outline-offset:3px}
.shp .hdl,.shp .xbtn{display:none;position:absolute;width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--brand);background:var(--brand);color:#fff;font-weight:700;padding:0;line-height:1;touch-action:none}
.shp.sel .hdl,.shp.sel .xbtn{display:grid;place-items:center}
.shp .hdl{right:-1.2rem;bottom:-1.2rem;cursor:nwse-resize}
.shp .xbtn{right:-1.2rem;top:-1.2rem}
.attrs li .input{border:0;background:transparent;padding:.3rem .2rem;min-height:2.6rem}
.attrs li .tag{flex:none;font-size:.85rem;font-weight:700;color:var(--brand-text);background:var(--brand-soft);border-radius:2rem;padding:.15rem .7rem}
.stage.wide{grid-template-columns:1fr}
.stage.wide .rail{display:none}
.tile.dim{opacity:.45;filter:grayscale(1)}
.canvaswrap.fill{flex:1 0 auto;min-height:22rem;display:flex;flex-direction:column}
.canvaswrap.fill .padtools{position:sticky;top:var(--chrome-h,0px);z-index:6;background:var(--surface);padding-bottom:.3rem}
.canvaswrap.fill .padstage{flex:1;min-height:0}
.sketch.fill{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;background:#fff}
.empty-pad{position:absolute;inset:0;display:grid;place-items:center;color:#8a8580;font-family:var(--serif);font-size:1.1rem}
.review{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1rem;align-items:start}
.adm{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:var(--bg);color:var(--ink)}
.adm .body{flex:1;min-height:0;overflow:auto;padding:1.125rem var(--edge) 1.375rem;display:flex;flex-direction:column;gap:.7rem;width:100%;max-width:1800px;margin:0 auto}
.gcard{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.8rem}
.grow{display:grid;grid-template-columns:4.5rem minmax(0,1.8fr) minmax(0,1fr) auto;gap:1.2rem;align-items:start}
.gnum{font-family:var(--serif);font-size:2.6rem;font-weight:700;color:var(--brand-text);line-height:1}
.tname{font-family:var(--serif);font-size:1.3rem;font-weight:700}
.pips{display:flex;gap:.3rem;margin:.5rem 0 .3rem}
.pip{width:.85rem;height:.85rem;border-radius:50%;background:var(--line)}
.pip.on{background:var(--ok)}
.pip.cur{background:var(--brand)}
.tag2{display:inline-block;margin-left:.5rem;font-size:.85rem;font-weight:700;color:#fff;background:var(--ok);border-radius:2rem;padding:.05rem .6rem}
.gacts{display:flex;flex-direction:column;gap:.5rem;min-width:9.5rem}
.fitwrap{min-width:0;width:100%}
.fitbox{width:min(100%,max(22rem,calc((100vh - 34rem) * var(--asp))));aspect-ratio:var(--asp)}
.fitbox img{height:100%!important;object-fit:fill}
.so{flex:1 0 auto;min-height:20rem;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);grid-template-rows:auto;gap:1rem}
.so.lean{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr)}
.so-col{display:flex;flex-direction:column;gap:.6rem;min-width:0}
.so-card{background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.55rem 1rem;display:flex;flex-direction:column;min-width:0;overflow:visible}
.so-card h3{font-family:var(--serif);font-size:1.15rem;margin:0 0 .5rem}
.ptop{display:flex;gap:1rem;align-items:center}
.pdraw{flex:0 0 14rem}
.prole{font-weight:700;font-size:.98rem;line-height:1.3}
.plists{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1rem;font-size:.84rem;line-height:1.25;margin-top:.4rem}
.plists ul{margin:.1rem 0;padding-left:1.1rem}
.plists li{margin:.15rem 0}
.stage.wide{padding-top:.625rem;padding-bottom:.625rem;gap:.6rem}
/* big share-out: front-of-room screen, so everything is larger and fills the space (no empty white) */
.so.big{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.1rem;min-height:calc(100vh - var(--chrome-h,0px) - 9.5rem)}
.so.big .so-col{gap:1.1rem}
.so.big .so-card{padding:.8rem 1.3rem}
.so.big .so-card h3{font-size:1.6rem;margin-bottom:.4rem}
.so.big .ptop{gap:1.3rem}
.so.big .pdraw{flex:0 0 clamp(12rem,30%,20rem)}
.so.big .prole{font-size:1.2rem}
.so.big .plists{font-size:1rem;gap:.3rem 1.4rem}
.so.big .plists li{margin:.2rem 0}
.so.big .chips{gap:.55rem}
.so.big .chip{font-size:1.05rem!important;min-height:2.2rem!important;padding:0 .9rem!important}
.so.big .so-prob{font-size:1.55rem!important;line-height:1.38!important}
.so.big .fitbox{width:100%}
.linkline{font-family:ui-monospace,Consolas,monospace;word-break:break-all;font-size:1.05rem;margin:0}
@media print{
  html,body{overflow:visible!important;height:auto!important;background:#fff!important}
  .app,.toast{display:none!important}
  .adm{position:static!important;display:block!important;background:#fff!important}
  .adm .top,.adm .noprint{display:none!important}
  .adm .body{overflow:visible!important;max-width:none!important}
  .gcard{break-inside:avoid;border-color:#999!important}
}
.persona-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1rem;min-height:0}

/* seyfarth prioritization matrix */
.mx{position:relative;flex:0 0 auto;height:max(28rem,calc(100vh - var(--chrome-h,0px) - 13rem));border:2px solid var(--line);border-radius:1.1rem;overflow:hidden;background:var(--surface);touch-action:none}
.mx-grid{position:absolute;left:0;right:0;top:0;height:62%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mx-q{padding:.7rem 1rem;font-family:var(--serif);font-weight:700;font-size:1.2rem;border:1px solid var(--line);color:var(--ink)}
.mx-tray{position:absolute;left:0;right:0;bottom:0;height:38%;background:var(--slate);border-top:3px dashed var(--line);padding:.35rem 1rem;color:var(--slate-ink);font-size:.9rem;font-weight:700}
.mx-note{position:absolute;width:14rem;background:var(--c);color:var(--sticky-ink);padding:.45rem .5rem .45rem .8rem;border-radius:.2rem .2rem .2rem 1.2rem;box-shadow:0 .25rem .8rem rgba(0,0,0,.25);border:2px solid rgba(0,0,0,.18);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.mx-note p{margin:0 0 .2rem;font-size:1rem;line-height:1.25}
.mx-note.tray{width:10.4rem;padding:.3rem .4rem .3rem .65rem}
.mx-note.tray p{font-size:.92rem;line-height:1.2}
.mx-note.tray.has-x p{padding-right:1.7rem}
.mx-note.tray .x{min-width:1.7rem;min-height:1.7rem;font-size:.8rem}
.mx-note .q{font-size:.8rem;opacity:.75;margin:0}
.mx-note .x{position:absolute;top:.15rem;right:.15rem;border:0;background:rgba(0,0,0,.12);color:inherit;border-radius:.5rem;min-width:2.2rem;min-height:2.2rem;font-weight:700}
.mx-note.has-x p{padding-right:2rem}
.mxr{position:relative;flex:1 1 auto;min-height:19rem;border:2px solid var(--line);border-radius:.9rem;overflow:hidden;background:var(--surface)}
.mxr .mx-grid{height:100%}
.mxr .mx-q{font-size:1.05rem}

<script>
/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})){
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
function toast(msg){
  const t = h("div", {class:"toast", role:"status"}, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}

const CASES = {

      focus: 0,

CASES.plg = {

};

/* ---------- state ---------- */
let S;
function freshState(mode){
  const c = CASES[mode];
  return {
    mode, stage: 0,
    team: {name: "", members: Array.from({length: mode === "plg2" || mode === "sey" ? 4 : 2}, () => ({name: "", talent: ""}))},
    personaId: c.personas ? c.personas[0].id : null,

    needOpts: [...c.needs], feelOpts: [...c.feelings], needCustom: [], needs: [], feelings: [],
    analogy: null, attrs: [],
    ideas: [], pickId: null,
    draft: {lane: "big", author: 0, text: "", buildOn: null},
    pitch: {key: "", idea: "", why: "", matter: ""},

}
const C = () => CASES[S.mode];
/* Day 2 and Seyfarth share the "makes them feel" wording and the needs-from-persona flow */
const isD2 = () => S.mode === "plg2" || S.mode === "sey";
const mName = i => (S.team.members[i] && S.team.members[i].name.trim()) || ("Teammate " + (i + 1));

const STAGES_BY = {
  bob: [
    {id: "team", short: "Team", phase: "Phase 1 · Team formation", title: "Meet your teammate", mins: 5, render: rTeam},

STAGES_BY.plg2 = [

  {id: "focus", short: "Problem Focus", phase: "Pulling It All Together", title: "Choose Your Problem Focus", mins: 2, render: rD2Focus},

STAGES_BY.sey = [
  {id: "challenge", short: "Our Challenge", phase: "Choose your challenge", title: "Choose Your Team’s Challenge", mins: 5, render: rSeyChallenge},
  {id: "hate", short: "I Hate It When", phase: "Problem finding", title: "I Hate It When…", mins: 5, render: rSeyHate},

/* ---------- shell ---------- */
function railWrap(i, ...nodes){
  const st = typeof i === "string" ? STG().find(x => x.id === i) : STG()[i];
  return [
    h("p", {class: "phase"}, st.phase),
    h("h2", {}, st.title),
    st.timed === false ? null : h("span", {class: "timepill"}, (st.suggested ? "Suggested time: " : "Time: ") + (st.timeLabel || st.mins + " minutes")),

function go(i){
  saveSketch();
  S.stage = Math.max(0, Math.min(STG().length - 1, i));
  render();
  window.scrollTo(0, 0);
  if (typeof liveTick === "function") liveTick();
}
function render(){
  S.maxStage = Math.max(S.maxStage || 0, S.stage);
  const st = STG()[S.stage];
  $("#subtitle").textContent = C().subtitle + (S.groupNo ? " · Group " + S.groupNo : "") + (demoId() ? " · Demo, not saved" : "");

  const sp = $("#stepper"); sp.replaceChildren(...STG().map((s, i) =>

      h("span", {class: "n"}, i < S.stage ? "✓" : String(i + 1)), s.short)));
  const out = st.render();
  $("#rail").replaceChildren(...out.rail.flat(Infinity).filter(Boolean));

}
$("#b-back").onclick = () => go(S.stage - 1);

function fillSample(){

  S.needs = [c.needs[1], c.needs[0]].slice(0, 2); S.feelings = [c.feelings[0]];
  S.analogy = sd.analogy; S.attrs = sd.attrs.map(i => ATTRS[sd.analogy][i]);
  S.ideas = sd.ideas.map(x => ({id: uid(), lane: x[0], author: x[1] % S.team.members.length, text: x[2], builds: [], votes: 0}));
  S.ideas[0].builds.push({text: "and the senior partner sponsor gets a ping when it’s time to check in", author: 1 % S.team.members.length});

/* ---------- stage 1: team ---------- */
function rTeam(){
  const rail = railWrap(0,

function sketchPad(key, opts){

      const grip = h("div", {class: "stk-grip", "aria-label": "Drag sticky note"}, "⠿");

/* Pre-arranged groups: the roster names and the challenges people entered on the worksheet QR page load into the
   team. Returns true if anything changed. People can still edit, add and remove teammates afterwards. */
function seyMerge(setup){
  if (S.mode !== "sey" || !setup || !setup.length) return false;
  const T = S.team, D = S.sey; let changed = false;
  D.removed = D.removed || [];
  if (!D.seeded){
    T.members = T.members.filter(m => (m.name || "").trim() || (m.challenge || "").trim() || (m.challenge2 || "").trim());
    D.seeded = true; changed = true;
  }
  setup.forEach(p => {
    if (D.removed.includes(normName(p.name))) return;
    const c = p.challenges || [], at = p.at || 0;
    let m = T.members.find(x => normName(x.name) === normName(p.name));
    if (!m){
      T.members.push({name: p.name, talent: "", challenge: c[0] || "", challenge2: c[1] || "", qrAt: at, qrC1: c[0] || "", qrC2: c[1] || ""});
      changed = true; return;
    }
    if (at && at !== (m.qrAt || 0)){
      if (!(m.challenge || "").trim() || m.challenge === (m.qrC1 || "")) m.challenge = c[0] || m.challenge || "";
      if (!(m.challenge2 || "").trim() || m.challenge2 === (m.qrC2 || "")) m.challenge2 = c[1] || m.challenge2 || "";
      m.qrAt = at; m.qrC1 = c[0] || ""; m.qrC2 = c[1] || ""; changed = true;
    }
  });
  while (T.members.length < 2) T.members.push({name: "", talent: ""});
  return changed;
}

function rSeyMatrix(){
  const M = S.sey.matrix;
  const rail = railWrap("priority",
    h("p", {}, "Use this matrix to take your 3-4 best ideas and place them accordingly."),
    h("ol", {}, h("li", {}, "Add each of your best directional ideas from the group brainstorm."), h("li", {}, "Drag each one onto the matrix: how easy is it to do, and how much impact would it have?")),
    h("p", {class: "muted"}, "Ideas in the top-left corner are the easier, higher-impact wins."));
  const author = h("div", {class: "row"}, S.team.members.map((m, i) =>
    h("button", {class: "chip who", "aria-pressed": String(S.draft.author === i), onclick: () => { S.draft.author = i; author.querySelectorAll(".chip").forEach((b, j) => b.setAttribute("aria-pressed", String(S.draft.author === j))); }},
      h("span", {class: "dot", style: "background:" + MEMBER_COLORS[i % MEMBER_COLORS.length]}), mName(i))));
  const inp = h("input", {class: "input", placeholder: "Type an idea (a few words), then Add", style: "flex:1;min-width:14rem", onkeydown: e => { if (e.key === "Enter") add(); }});
  const board = h("div", {class: "mx"});
  const G = MX_G;
  const where = n => {
    const cy = n.y + 0.05, cx = n.x + 0.07;
    if (cy > G) return "Not placed yet";
    return (cx < 0.5 ? "Easier to do" : "Harder to do") + " · " + (cy < G / 2 ? "higher impact" : "lower impact");
  };
  /* the next free spot in the tray: rows of notes, as many per row as fit the width, so added ideas never pile up */
  function traySlot(k){
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    const bw = board.clientWidth || 60 * rem, bh = board.clientHeight || 40 * rem;
    const step = 11 * rem, rowH = 4.7 * rem, cols = Math.max(1, Math.floor((bw - 0.02 * bw) / step));
    const rows = Math.max(1, Math.floor(((1 - G) * bh - 2.2 * rem) / rowH)), cap = cols * rows;
    const lap = Math.floor(k / cap), j = k % cap;   /* past a full tray, the next lap sits just offset so nothing is hidden */
    return {x: (0.01 * bw + (j % cols) * step + lap * 1.2 * rem) / bw, y: G + (2 * rem + Math.floor(j / cols) * rowH + lap * 0.6 * rem) / bh};
  }
  function add(){
    const t = inp.value.trim(); if (!t) return;
    const k = M.filter(n => n.y + 0.05 > G).length;
    M.push({id: uid(), text: t, author: S.draft.author, ...traySlot(k)});
    inp.value = ""; draw(); inp.focus();

  let z = 1;
  function draw(){
    board.replaceChildren(
      h("div", {class: "mx-grid"},
        h("div", {class: "mx-q", style: "background:var(--s2)"}, "Easier to do & higher impact"),
        h("div", {class: "mx-q", style: "background:var(--s3)"}, "Harder to do & higher impact"),

        h("div", {class: "mx-q", style: "background:var(--surface)"}, "Harder to do & lower impact")),
      h("div", {class: "mx-tray"}, "Ideas waiting to be placed: drag each one up onto the matrix"));
    if (!M.length) board.append(h("div", {class: "empty", style: "top:0;height:" + G * 100 + "%"}, "Add your 3-4 best ideas above, then drag them onto the matrix."));
    M.forEach(n => {

      const el = h("div", {class: "mx-note has-x" + (n.y + 0.05 > G ? " tray" : ""), style: "left:" + n.x * 100 + "%;top:" + n.y * 100 + "%;--c:" + STICKY[n.author % 4]}, x, h("p", {}, n.text), q);
      let sx, sy, ox, oy, drag = false, r;
      el.addEventListener("pointerdown", e => {
        if (e.target.closest("button")) return;
        drag = true; r = board.getBoundingClientRect(); sx = e.clientX; sy = e.clientY; ox = n.x; oy = n.y;
        el.setPointerCapture(e.pointerId); el.style.zIndex = ++z; el.style.cursor = "grabbing";
      });
      el.addEventListener("pointermove", e => {
        if (!drag) return;
        n.x = Math.max(0, Math.min(1 - el.offsetWidth / r.width, ox + (e.clientX - sx) / r.width));
        n.y = Math.max(0, Math.min(1 - el.offsetHeight / r.height, oy + (e.clientY - sy) / r.height));
        el.style.left = n.x * 100 + "%"; el.style.top = n.y * 100 + "%";
        q.textContent = where({x: n.x + (el.offsetWidth / r.width / 2 - 0.07), y: n.y + (el.offsetHeight / r.height / 2 - 0.05)});
      });
      const end = () => {
        if (!drag) return; drag = false; el.style.cursor = "grab";
        el.classList.toggle("tray", n.y + 0.05 > G);
        if (r){ n.x = Math.max(0, Math.min(1 - el.offsetWidth / r.width, n.x)); n.y = Math.max(0, Math.min(1 - el.offsetHeight / r.height, n.y)); el.style.left = n.x * 100 + "%"; el.style.top = n.y * 100 + "%"; }
      };
      el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
      board.append(el);
    });
  }

/* QR code (bundled generator, nothing loads from the internet) */
function qrObj(text){ const q = qrcode(0, "M"); q.addData(text); q.make(); return q; }
function qrSvg(text){
  const q = qrObj(text), n = q.getModuleCount(), m = 4; let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + (c + m) + " " + (r + m) + "h1v1h-1z";
  return '<svg viewBox="0 0 ' + (n + 2 * m) + " " + (n + 2 * m) + '" role="img" aria-label="Worksheet QR code" shape-rendering="crispEdges" style="width:100%;height:auto;display:block"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
function qrPng(text){
  const q = qrObj(text), n = q.getModuleCount(), m = 4, px = 16, c = document.createElement("canvas");
  c.width = c.height = (n + 2 * m) * px; const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + m) * px, (r + m) * px, px, px);
  return c.toDataURL("image/png");
}

  if (d.state) applySnapshot(st, d.state);
  if (st.mode === "sey"){ const keep = S; S = st; try { seyMerge(d.setup.members); } finally { S = keep; } }
  else st.d2.pool = {talent: d.setup.talent ? [d.setup.talent] : [], client: d.setup.client ? [d.setup.client] : []};
  st.drawing = d.drawing || null; st.whiteboard = d.whiteboard || null;
  g._st = st; g._upd = g.updatedAt;
}
function setPresent(id){
  A.present = id;
  const g = A.groups.find(x => x.id === id);
  if (A.live && g){
    A.loading = true; renderAdmin();
    loadFull(g).catch(e => { A.msg = errText(e); }).then(() => { A.loading = false; if (A.present === id) renderAdmin(); });
  } else renderAdmin();
}
function saveConfigSoon(){ clearTimeout(A._t); A._t = setTimeout(saveConfig, 900); }
async function saveConfig(){
  try {
    const d = await api("PUT", "/api/admin/config", {groups: A.groups.map(g => A.version === "sey" ? {id: g.id, key: g.key, members: rosterNames(g)} : {id: g.id, key: g.key, talent: g.talent, client: g.client})}, {pin: A.pin});
    d.groups.forEach(x => { const g = A.groups.find(y => y.id === x.id); if (g) g.key = x.key; });
    A.dirty = new Set(); A.msg = "";
    A.saved = "Setup saved " + new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit", second: "2-digit"});
    const sub = document.getElementById("adm-sub"); if (sub) sub.textContent = versionName(A.version) + " · live · " + A.saved;
  } catch (e){ A.msg = "Couldn’t save the setup: " + errText(e); const sub = document.getElementById("adm-sub"); if (sub) sub.textContent = A.msg; }
}
function adminLock(){
  const unlock = () => { A.pin = inp.value.trim(); if (!A.pin) return; setPin(A.pin); A.locked = false; A.msg = ""; adminLoad(); };
  const inp = h("input", {class: "input", type: "password", placeholder: "Facilitator PIN", style: "max-width:22rem", onkeydown: e => { if (e.key === "Enter") unlock(); }});
  const top = h("header", {class: "top"}, h("div", {}, h("h1", {}, "Facilitator View"), h("div", {class: "sub"}, "Workshop facilitator sign-in")), h("div", {class: "spacer"}),
    fullBtn(),
    h("button", {class: "tbtn", onclick: () => { location.hash = ""; route(); }}, "Group view"));
  const body = h("div", {class: "body"}, h("div", {class: "gcard", style: "max-width:34rem;margin:3rem auto;gap:1rem"},
    h("h3", {style: CARD_H}, "Facilitator sign-in"),
    h("p", {class: "muted", style: "margin:0"}, "Enter the PIN you set as ADMIN_PIN in Netlify."),
    inp, h("div", {class: "row"}, h("button", {class: "btn primary", onclick: unlock}, "Unlock")),
    A.msg ? h("p", {style: "margin:0;color:var(--brand-text);font-weight:700"}, A.msg) : null));
  return [top, body];
}
setInterval(() => { if (A && A.live && !A.locked && document.getElementById("admin")?.style.display === "flex") adminPoll(false); }, 6000);

/* Group links carry the group number and that group's two pain points: #g=3&t=...&c=... */
function applyGroupHash(){
  const hs = location.hash.slice(1);
  if (!hs || hs === "admin") return;
  const p = new URLSearchParams(hs);
  if (!p.get("g")) return;
  S.groupNo = p.get("g");
  const t = p.get("t") || "", c = p.get("c") || "";
  S.d2.pool = {talent: t ? [t] : [], client: c ? [c] : []};
}
function route(){
  const adm = location.hash === "#admin";
  document.querySelector(".app").style.display = adm ? "none" : "";
  const el = document.getElementById("admin");
  if (adm){ if (!A) seedAdmin(); renderAdmin(); }
  else if (el && el.style.display !== "none"){ el.style.display = "none"; applyGroupHash(); render(); }
}

/* ---------- boot ---------- */
/* Prototype focus: only Potomac Day 2 is shown.
   Other cases (bob, omv, plg = Day 1) are still defined above (CASES / STAGES_BY).
   To bring them back: set SHOW_CASE_SWITCHER = true. */
const SHOW_CASE_SWITCHER = false;
const DEFAULT_MODE = "plg2";
/* #demo=<mode> opens a one-screen demo of that version (linked from the facilitator picker). It never saves,
   and shows the version switcher so the demos can be compared. */
function demoId(){ const d = new URLSearchParams(location.hash.slice(1)).get("demo"); return d && CASES[d] ? d : ""; }
S = freshState(demoId() || DEFAULT_MODE);
if (!SHOW_CASE_SWITCHER && !demoId()) document.querySelector(".seg").style.display = "none";
applyGroupHash();
window.addEventListener("hashchange", route);
document.querySelector(".app").style.visibility = "hidden";
initLive().then(() => { document.querySelector(".app").style.visibility = ""; render(); route(); });
</script>
