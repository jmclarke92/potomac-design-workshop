<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter your challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--surface:#fff;--ink:#1f1c1b;--muted:#6a645e;--line:#d9d3ca;--brand:#a51c30;--brand-text:#a51c30;--ok:#2f7a45;--ok-soft:#e3f3e8;
  --serif:"Literata",Georgia,"Times New Roman",serif;--sans:"Atkinson Hyperlegible","Segoe UI",system-ui,Arial,sans-serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#151312;--surface:#211e1c;--ink:#f2ede8;--muted:#a79f97;--line:#3b3632;--brand-text:#ff8a98;--ok:#6fcf8a;--ok-soft:#1e3a28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.1rem;line-height:1.4}
.wrap{max-width:40rem;margin:0 auto;padding:1.2rem 16px 3rem;display:grid;gap:1rem}
h1{font-family:var(--serif);font-size:1.7rem;margin:0;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--surface);border:2px solid var(--line);border-radius:.8rem;padding:.7rem .9rem;min-height:3.2rem}
textarea{min-height:9rem;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:.4rem 0 .6rem}
.names{display:grid;gap:.5rem}
.namebtn{display:flex;justify-content:space-between;align-items:center;gap:.6rem;text-align:left;min-height:3.4rem;padding:.6rem .9rem;border:2px solid var(--ink);border-radius:.8rem;background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.namebtn.in{background:var(--ok-soft);border-color:var(--ok)}
.namebtn .tick{color:var(--ok);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
.btn{min-height:3.2rem;padding:0 1.2rem;border:2px solid var(--ink);border-radius:.8rem;background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.quiet{border-color:var(--line);font-weight:400}
label{font-weight:700;display:block;margin-bottom:.3rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:1rem;display:grid;gap:.8rem}
.thanks{text-align:center;justify-items:center;padding:1.6rem 1rem}
.thanks .big{font-size:4rem;color:var(--ok);line-height:1}
.err{color:var(--brand-text);font-weight:700}
details summary{cursor:pointer;font-weight:700;padding:.4rem 0}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
</style>
</head>
<body>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>
<script>
(function(){
  const app = document.getElementById("app");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
  let people = [], groups = [], me = null, extraGroup = "";

  async function call(method, body){
    const r = await fetch("/api/people", {method, headers: {"content-type": "application/json"}, body: body ? JSON.stringify(body) : undefined, cache: "no-store"});
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(j.error || "Something went wrong. Try again.");
    return j;
  }
  function message(t, sub){ app.innerHTML = "<h1>" + esc(t) + "</h1><p class='muted'>" + esc(sub || "") + "</p>"; }

  function pick(keep){
    me = null;
    app.innerHTML = `<h1>Enter your challenge</h1>
      <p>Start typing your name, tap it, then type the challenge you’d like to see addressed.</p>
      <div class="search"><input id="find" type="text" placeholder="Start typing your name" autocomplete="off" autocapitalize="words" value="${esc(keep || "")}"></div>
      <div class="names" id="list"></div>
      <details id="other"><summary>My name isn’t listed</summary>
        <div class="card"><div><label for="on">Your first and last name</label><input id="on" type="text" autocomplete="name"></div>
        <div><label for="og">Your group number</label><select id="og"><option value="">Choose…</option>${groups.map(g => `<option value="${g}">Group ${g}</option>`).join("")}</select></div>
        <button class="btn primary" type="button" id="goOther">Continue</button><p class="err" id="oerr"></p></div></details>`;
    const list = app.querySelector("#list"), box = app.querySelector("#find");
    const draw = () => {
      const toks = norm(box.value).split(" ").filter(Boolean);
      const hits = people.filter(p => { const n = norm(p.name); return toks.every(t => n.includes(t)); });
      list.innerHTML = hits.length ? hits.map(p => `<button type="button" class="namebtn ${p.done ? "in" : ""}" data-n="${esc(p.name)}"><span>${esc(p.name)}</span>${p.done ? '<span class="tick">✔ In</span>' : ""}</button>`).join("")
        : `<p class="muted">${people.length ? "No one matches. Check the spelling, or use “My name isn’t listed”." : "No names are set up yet. Ask your facilitator."}</p>`;
    };
    box.oninput = draw; draw();
    list.onclick = e => { const b = e.target.closest(".namebtn"); if (!b) return; me = people.find(p => p.name === b.dataset.n); extraGroup = ""; form(); };
    app.querySelector("#goOther").onclick = () => {
      const n = app.querySelector("#on").value.replace(/\s+/g, " ").trim(), g = app.querySelector("#og").value;
      if (!n || !g){ app.querySelector("#oerr").textContent = "Add your name and choose your group."; return; }
      me = {name: n, done: false}; extraGroup = g; form();
    };
    if (!keep) box.focus();
  }

  function form(){
    app.innerHTML = `<h1>Hi, ${esc(me.name.split(" ")[0])}</h1>
      <p>What is the challenge you’d like to see addressed? This is the one from your worksheet: a firm or practice area challenge (client-related or people/talent-related) to address in the next 6-12 months. One or two sentences is plenty.</p>
      <div class="card">
        <div><label for="c1">The challenge I’d like to see addressed is…</label><textarea id="c1" maxlength="500"></textarea></div>
        <div id="second"><button class="btn quiet" type="button" id="add2">+ Add a 2nd option</button></div>
        <p class="err" id="err"></p>
        <div class="row"><button class="btn primary" type="button" id="save">Save</button><button class="btn quiet" type="button" id="back">Not me</button></div>
        ${me.done ? '<p class="muted">Saving again replaces what you entered before.</p>' : ""}
      </div>`;
    app.querySelector("#back").onclick = () => pick();
    app.querySelector("#add2").onclick = () => {
      app.querySelector("#second").innerHTML = '<label for="c2">A second option I’d like to see addressed is…</label><textarea id="c2" maxlength="500" style="min-height:7rem" placeholder="Optional"></textarea>';
      app.querySelector("#c2").focus();
    };
    app.querySelector("#save").onclick = async () => {
      const c1 = app.querySelector("#c1").value.trim(), c2el = app.querySelector("#c2"), c2 = c2el ? c2el.value.trim() : "";
      const err = app.querySelector("#err");
      if (!c1){ err.textContent = "Type your challenge first."; return; }
      const btn = app.querySelector("#save"); btn.disabled = true; err.textContent = "";
      try {
        await call("PUT", {name: me.name, group: extraGroup || undefined, challenges: [c1, c2].filter(Boolean)});
        const mine = people.find(p => norm(p.name) === norm(me.name)); if (mine) mine.done = true; else people.push({name: me.name, done: true});
        app.innerHTML = `<div class="card thanks"><div class="big">✔</div><h1>Your challenge is in</h1><p>It will be waiting on your team’s screen. Nothing else to do here.</p><button class="btn" type="button" id="again">Someone else, or edit mine</button></div>`;
        app.querySelector("#again").onclick = () => pick();
      } catch (e){ err.textContent = e.message; btn.disabled = false; }
    };
    app.querySelector("#c1").focus();
  }

  (async () => {
    try { const r = await call("GET"); people = r.people || []; groups = r.groups || []; }
    catch (e){ return message("This page isn’t open yet", "Ask your facilitator, then reload."); }
    pick();
  })();
})();
</script>
</body>
</html>
